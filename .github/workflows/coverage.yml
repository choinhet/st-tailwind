name: Coverage

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv add --dev pytest pytest-cov pytest-playwright pytest-base-url psutil coverage-badge
          uv add streamlit
          uv pip install -e .
      
      - name: Install Playwright browsers
        run: |
          uv pip install playwright
          uv run playwright install --with-deps
      
      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/test_st_tailwind.py --cov=st_tailwind --cov-report=xml --cov-report=html --cov-report=term-missing
      
      - name: Run e2e tests
        run: |
          uv run pytest tests/e2e -v --headed
      
      - name: Generate coverage badge
        run: |
          uv run coverage-badge -o coverage.svg -f
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov
            coverage.xml
            coverage.svg
      
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add coverage.svg
          git commit -m "docs: update coverage badge [skip ci]" || echo "No changes to commit"
          git push