name: Coverage

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv add --dev pytest pytest-cov pytest-playwright pytest-base-url psutil
          uv add streamlit
          uv pip install -e .
      
      - name: Install Playwright browsers
        run: |
          uv pip install playwright
          uv run playwright install --with-deps
      
      - name: Run unit tests with coverage
        id: coverage
        run: |
          COVERAGE_OUTPUT=$(uv run pytest tests/test_st_tailwind.py --cov=st_tailwind --cov-report=xml --cov-report=html --cov-report=term-missing)
          COVERAGE_PCT=$(echo "$COVERAGE_OUTPUT" | grep -oP "TOTAL\s+\d+\s+\d+\s+\K\d+")
          echo "percentage=$COVERAGE_PCT" >> $GITHUB_OUTPUT
      
      - name: Run e2e tests
        run: |
          uv run pytest tests/e2e -v --headed
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov
            coverage.xml